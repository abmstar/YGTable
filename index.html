<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">

    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    >

    <meta name="theme-color" content="#245b4a">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>여강고 선생님 시간표</title>

    <style>
      :root {
        color-scheme: light;
        --green: #245b4a;
        --ink: #172e29;
        --muted: #596d65;
        --line: #dae3dd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f2f5f0;
        color: var(--ink);
        font-family:
          system-ui,
          'Apple SD Gothic Neo',
          'Nanum Gothic',
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: white;
        border-radius: 10px;
        color: var(--ink);
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #c88227;
        outline-offset: 2px;
      }

      button.primary {
        background: var(--green);
        color: white;
        border: 0;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      input {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        color: var(--ink);
      }

      /* 모든 입력창과 버튼 높이·크기 완전 통일 (34px) */
      .controls input,
      .controls button,
      .nav button,
      .all-class-tabs button,
      #install {
        height: 34px;
        padding: 0 12px;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        box-sizing: border-box;
      }

      .shell {
        max-width: 1050px;
        margin: auto;
        padding: 30px 18px 40px;
      }

      /* 상단 제목 및 설치 버튼 */
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .header-content {
        flex: 1;
        min-width: 0;
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.16em;
        color: var(--green);
        font-weight: 750;
      }

      .title-row {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        margin-top: 7px;
      }

      h1 {
        font-size: 28px;
        margin: 7px 0;
      }

      .title-row h1 {
        margin: 0;
      }

      p {
        line-height: 1.6;
      }

      .sub {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }

      .title-row .tagline {
        margin: 0;
        padding-bottom: 3px;
        line-height: 1.3;
        word-break: keep-all;
      }

      /* 교사명 입력, 조회, 새로고침 */
      .controls {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: nowrap;
        margin: 22px 0 16px;
      }

      .controls .grow {
        flex: 1;
      }

      .teacher-input {
        width: 170px;
        padding: 0 11px;
      }

      .controls .icon-btn {
        width: 34px;
        padding: 0;
        font-size: 16px;
      }

      /* 주간 제목 */
      .weekbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 18px 0 12px;
      }

      .week-heading {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .weekbar h2 {
        font-size: 23px;
        margin: 0;
      }

      .badge {
        display: inline-block;
        font-size: 12px;
        color: var(--green);
        background: #e0ede4;
        border-radius: 30px;
        padding: 6px 10px;
      }

      .week-heading .badge {
        margin-bottom: 0;
        flex-shrink: 0;
      }

      /* PC 주간 이동 버튼 */
      .nav {
        display: flex;
        gap: 6px;
      }

      /* 시간표 (주간·일간 셀 높이 46px / 헤더 30px로 통일) */
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 35px #173a2910;
        touch-action: pan-y;
      }

      .table {
        display: grid;
        grid-template-columns: 0.65fr repeat(5, minmax(0, 1fr));
      }

      .cell {
        min-height: 46px;
        padding: 2px 3px;
        border-right: 1px solid #e7ece7;
        border-bottom: 1px solid #e7ece7;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-size: 14px;
        line-height: 1.2;
        gap: 0;
      }

      .cell:nth-child(6n) {
        border-right: 0;
      }

      .cell.head {
        min-height: 30px;
        padding: 2px 3px;
        font-weight: 700;
        background: #f7f9f5;
      }

      .cell.period {
        font-size: 13px;
        color: var(--muted);
        background: #fafbf8;
      }

      .cell.today {
        background: #f0f7f0;
      }

      .head.today {
        color: var(--green);
        box-shadow: inset 0 3px var(--green);
      }

      .empty-cell {
        color: #c3cec6;
      }

      /* 오늘 전체 학급 시간표 (1-1반~3-3반 10열: 교시 + 9개 학급) */
      .all-class-section {
        margin-top: 22px;
      }

      .all-class-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .all-class-header h3 {
        margin: 0;
        font-size: 18px;
        color: var(--ink);
      }

      .all-class-tabs {
        display: flex;
        gap: 6px;
      }

      .all-class-table {
        display: grid;
        grid-template-columns: 0.75fr repeat(9, minmax(0, 1fr));
      }

      .all-class-table .cell {
        min-height: 46px;
        padding: 2px 2px;
        font-size: 13px;
        border-right: 1px solid #e7ece7;
      }

      .all-class-table .cell:nth-child(10n) {
        border-right: 0;
      }

      /* 학년 구분선 (1-3반 뒤, 2-3반 뒤) */
      .all-class-table .grade-divider {
        border-right: 2px solid #9eb8a8;
      }

      .all-class-table .cell.head {
        min-height: 30px;
        font-size: 12px;
      }

      .all-class-table .date-cell {
        font-weight: 750;
        min-height: 36px;
        background: #eaf2eb;
        border-right: 0;
      }

      /* 오늘의 중식 배너 (주간 시간표 바로 아래) */
      .lunch-box {
        margin: 10px 0 4px;
        padding: 10px 14px;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink);
      }

      .lunch-box[hidden] {
        display: none;
      }

      .lunch-box strong {
        color: var(--green);
        margin-right: 6px;
      }

      /* 조회 안내 */
      .notice {
        padding: 34px 22px;
        text-align: center;
        line-height: 1.8;
        color: var(--muted);
      }

      .notice strong {
        display: block;
        color: var(--ink);
        font-size: 18px;
        margin-bottom: 8px;
      }

      .status {
        color: var(--muted);
        font-size: 12px;
        min-height: 20px;
        margin-top: 8px;
      }

      .privacy {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
        margin-top: 24px;
      }

      #install {
        display: none;
        flex-shrink: 0;
      }

      @media (max-width: 768px) {
        .nav {
          display: none;
        }
      }

      /* 휴대전화 (주간·일간 셀 높이 42px / 헤더 26px로 통일) */
      @media (max-width: 540px) {
        .shell {
          padding: 22px 10px;
        }

        h1 {
          font-size: 23px;
        }

        .top {
          align-items: flex-start;
        }

        .title-row {
          gap: 8px;
        }

        .title-row .tagline {
          font-size: 11px;
          padding-bottom: 2px;
        }

        .controls {
          gap: 6px;
          margin: 16px 0 12px;
        }

        .teacher-input {
          width: 145px;
          padding: 0 10px;
        }

        .cell {
          min-height: 42px;
          padding: 2px;
          font-size: 11px;
          line-height: 1.15;
        }

        .cell.head {
          min-height: 26px;
          padding: 2px;
        }

        .table {
          grid-template-columns: 34px repeat(5, minmax(0, 1fr));
        }

        .cell.period {
          font-size: 10px;
        }

        .weekbar h2 {
          font-size: 20px;
        }

        .panel {
          border-radius: 14px;
        }

        /* 모바일 10열 전체 시간표 가독성 최적화 */
        .all-class-table {
          grid-template-columns: 26px repeat(9, minmax(0, 1fr));
        }

        .all-class-table .cell {
          min-height: 42px;
          padding: 2px 1px;
          font-size: 10px;
          line-height: 1.12;
        }

        .all-class-table .cell.head {
          min-height: 26px;
          font-size: 10px;
        }

        .all-class-table .date-cell {
          font-size: 12px !important;
          min-height: 32px !important;
        }

        .lunch-box {
          padding: 9px 12px;
          font-size: 12px;
        }
      }
    </style>
  </head>

  <body>
    <main class="shell">
      <header class="top">
        <div class="header-content">
          <div class="eyebrow">YG Teacher / TIMETABLE</div>

          <div class="title-row">
            <h1>여강고 선생님 시간표</h1>
            <p class="sub tagline">사랑을 담은 수업</p>
          </div>
        </div>

        <button id="install">앱 설치</button>
      </header>

      <form id="teacherForm" class="controls">
        <label for="teacher" hidden>교사명</label>

        <input
          id="teacher"
          class="teacher-input"
          aria-label="교사명"
          placeholder="교사명 입력"
          maxlength="40"
          required
        >

        <button class="primary" type="submit">
          조회
        </button>

        <span class="grow"></span>

        <button type="button" id="refresh" class="icon-btn" aria-label="새로고침" title="새로고침">
          ↻
        </button>
      </form>

      <section class="weekbar">
        <div class="week-heading">
          <span class="badge" id="relative">이번 주</span>
          <h2 id="weekTitle"></h2>
        </div>

        <nav class="nav" aria-label="주간 이동">
          <button id="previous" aria-label="이전 주">
            이전
          </button>

          <button id="thisWeek" aria-label="이번 주로 이동">
            오늘
          </button>

          <button id="next" aria-label="다음 주">
            다음
          </button>
        </nav>
      </section>

      <section
        id="surface"
        class="panel"
        aria-label="주간 시간표"
      >
        <div id="schedule"></div>
      </section>

      <!-- 날짜 연동 중식 배너 -->
      <div id="lunchBox" class="lunch-box" hidden></div>

      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      ></div>

      <!-- 오늘 전체 학급 시간표 (1-1반 ~ 3-3반) -->
      <section class="all-class-section" aria-label="전체 학급 일간 시간표">
        <div class="all-class-header">
          <h3 id="allClassTitle">전체 시간표</h3>
          <div class="all-class-tabs">
            <button type="button" id="allTodayBtn" class="primary">오늘</button>
            <button type="button" id="allNextBtn">다음</button>
          </div>
        </div>

        <div id="allClassSurface" class="panel">
          <div id="allClassSchedule"></div>
        </div>

        <div
          id="allClassStatus"
          class="status"
          role="status"
          aria-live="polite"
        ></div>
      </section>

      <footer class="privacy">
        시간표는 조회 시 원본 시트의 내용을 반영합니다.
        오프라인에서는 마지막 저장본이 표시되므로 변경 여부와 갱신 시각을 확인하세요.
        교사명은 이 기기에 저장되며 로그인이나 인증이 필요 없습니다.
        수정 요청은 안병무에게 연락 주세요.
      </footer>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
